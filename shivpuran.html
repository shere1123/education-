<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>शिव पुराण कथा (Shiv Puran)</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f97316">
    <style>
        * { box-sizing: border-box; }
        :root {
            --primary-gradient: linear-gradient(135deg, #f97316 0%, #c2410c 100%);
            --bg-color: #0b0f19;
            --text-main: #ffffff;
            --main-theme-color: #e11d48;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0 0 30px 0;
            overflow-x: hidden;
        }
        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white; text-align: center;
            padding: 25px 20px; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        header h1 { margin: 0; font-size: 24px; font-weight: 800; color: #f97316; }
        header p { margin: 6px 0 0 0; font-size: 13px; opacity: 0.8; }

        .container { width: 100%; max-width: 800px; margin: 20px auto; padding: 0 15px; }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media(min-width: 600px) {
            .content-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .content-card {
            background: #1e293b;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .content-card:hover {
            transform: translateY(-4px);
            border-color: rgba(249, 115, 22, 0.5);
        }

        .thumbnail-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #0f172a;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .thumbnail-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .icon-overlay {
            position: absolute;
            width: 45px; height: 45px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .play-overlay { color: #ff0000; }
        .image-overlay { color: #38bdf8; }

        .card-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            line-height: 1.4;
        }
        .card-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        .card-date {
            color: #38bdf8;
            font-weight: 600;
        }
        .card-views {
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .read-more-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        #fullScreenModal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0; top: 0;
            width: 100vw; height: 100vh;
            background-color: #f8fafc;
            overflow-y: auto;
            padding: 20px 15px;
            box-sizing: border-box;
        }
        .modal-inner {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 40px;
        }

        .modal-header-title {
            font-size: 26px;
            font-weight: 900;
            color: var(--main-theme-color);
            line-height: 1.4;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
        }

        .modal-meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 700;
        }
        .modal-date {
            color: #0369a1;
        }
        .modal-views {
            color: #475569;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid #cbd5e1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        .modal-image-container {
            width: 100%;
            max-height: 60vh;
            border-radius: 14px;
            overflow: hidden;
            background: #e2e8f0;
            border: 2px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-image-container img {
            width: 100%;
            height: auto;
            max-height: 60vh;
            object-fit: contain;
            display: block;
        }

        .modal-description {
            font-size: 20px; 
            color: #1e293b; 
            line-height: 1.9;
            font-weight: 700; 
            background: #ffffff; 
            padding: 24px; 
            border-radius: 14px;
            border: 1px solid #cbd5e1; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            word-wrap: break-word;
            text-align: justify; 
            text-justify: inter-word;
        }

        .banner-ad-container {
            width: 100%;
            background: #ffffff;
            border: 2px dashed #94a3b8;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin: 5px 0;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .social-follow-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 15px 0;
            padding: 14px 18px;
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            border-radius: 14px;
            border: 2px solid #fdba74;
            box-shadow: 0 6px 18px rgba(249, 115, 22, 0.12);
        }
        .follow-text {
            font-size: 16px;
            font-weight: 800;
            color: #c2410c;
        }
        .social-icons-group {
            display: flex;
            gap: 12px;
        }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }
        .social-btn:hover {
            transform: scale(1.1);
        }
        .facebook-bg { background-color: #1877f2; }
        .whatsapp-bg { background-color: #25d366; }
        .tiktok-bg { background-color: #000000; }

        .close-modal-btn {
            background: linear-gradient(135deg, #e11d48, #be123c);
            color: white;
            border: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 20px rgba(225, 29, 72, 0.3);
            margin-top: 15px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <h1>शिव पुराण कथा</h1>
        <p>भगवान शिवको महिमा, ज्योतिर्लिंग र दिव्य कथा</p>
    </header>

    <div class="container">
        <div id="contentGrid" class="content-grid">
            <div style="text-align: center; color: #94a3b8; grid-column: span 2; padding: 40px; font-weight: bold;">डाटा लोड हुँदैछ...</div>
        </div>
    </div>

    <div id="fullScreenModal">
        <div class="modal-inner">
            <div id="modalContentArea"></div>
            <button class="close-modal-btn" onclick="closeFullModal()">बन्द गर्नुहोस् (Close)</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, updateDoc, increment, onSnapshot, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAe32qMUjBMUBL4N6jS8eyVixK2gHMVuXw",
            authDomain: "gk-nepal-df869.firebaseapp.com",
            projectId: "gk-nepal-df869",
            storageBucket: "gk-nepal-df869.firebasestorage.app",
            messagingSenderId: "454233438620",
            appId: "1:454233438620:web:a8292322e04ffcf2b23059"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        try {
            enableIndexedDbPersistence(db).catch((err) => {});
        } catch (e) {}

        let currentItems = [];
        let unsubscribe = null;

        function getCleanYouTubeId(input) {
            if (!input) return '';
            if (input.length === 11 && !input.includes('/') && !input.includes('.')) {
                return input;
            }
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = input.match(regExp);
            return (match && match[2].length === 11) ? match[2] : input;
        }

        function insertAdAfterWords(fullText, wordLimit = 50) {
            if (!fullText) return '';
            let words = fullText.split(/\s+/);
            if (words.length <= wordLimit) {
                return `<div class="modal-description">${fullText}</div>`;
            }

            let firstPart = words.slice(0, wordLimit).join(' ');
            let secondPart = words.slice(wordLimit).join(' ');

            let bannerAdHtml = `
                <div class="banner-ad-container">
                    <span>[ ब्यानर एड (Banner Ad) यहाँ देखिनेछ ]</span>
                </div>
            `;

            let socialFollowHtml = `
                <div class="social-follow-container">
                    <span class="follow-text">हामीलाई Follow गर्नुहोस्:</span>
                    <div class="social-icons-group">
                        <a href="https://www.facebook.com/your-page-link" target="_blank" class="social-btn facebook-bg" title="Facebook Page Follow गर्नुहोस्"><i class="fa-brands fa-facebook-f"></i></a>
                        <a href="https://whatsapp.com/channel/your-channel-link" target="_blank" class="social-btn whatsapp-bg" title="WhatsApp Join गर्नुहोस्"><i class="fa-brands fa-whatsapp"></i></a>
                        <a href="https://www.tiktok.com/@your-tiktok-id" target="_blank" class="social-btn tiktok-bg" title="TikTok Follow गर्नुहोस्"><i class="fa-brands fa-tiktok"></i></a>
                    </div>
                </div>
            `;

            return `
                <div class="modal-description">${firstPart}</div>
                ${bannerAdHtml}
                ${socialFollowHtml}
                <div class="modal-description">${secondPart}</div>
            `;
        }

        function loadShivPuranData() {
            const grid = document.getElementById('contentGrid');

            if (unsubscribe) {
                unsubscribe();
            }

            try {
                unsubscribe = onSnapshot(collection(db, "shivpuran"), (querySnapshot) => {
                    currentItems = [];
                    querySnapshot.forEach((docSnap) => {
                        currentItems.push({ id: docSnap.id, ...docSnap.data() });
                    });

                    if (currentItems.length === 0) {
                        grid.innerHTML = `<div style="text-align: center; color: #94a3b8; grid-column: span 2; padding: 40px; font-weight: bold;">यस क्याटेगोरीमा हाल कुनै सामग्री उपलब्ध छैन।</div>`;
                        return;
                    }

                    let html = '';
                    currentItems.forEach((item, index) => {
                        let rawVidInput = item.videoId || item.videoLink || '';
                        let cleanId = getCleanYouTubeId(rawVidInput);
                        let isVideoItem = (item.type === 'video' || cleanId.length === 11);

                        let overlayIcon = isVideoItem ? 
                            `<div class="icon-overlay play-overlay"><i class="fa-solid fa-play"></i></div>` : 
                            `<div class="icon-overlay image-overlay"><i class="fa-solid fa-image"></i></div>`;

                        let displayImg = item.imageUrl;
                        if (!displayImg && isVideoItem && cleanId.length === 11) {
                            displayImg = `https://img.youtube.com/vi/${cleanId}/hqdefault.jpg`;
                        }
                        if (!displayImg) {
                            displayImg = 'https://images.unsplash.com/photo-1609137144813-772c676d75ce?w=800';
                        }

                        let viewCount = item.viewCount || 0;
                        
                        html += `
                            <div class="content-card" onclick="openDetail(${index})">
                                <div class="thumbnail-box">
                                    <img src="${displayImg}" alt="Thumbnail" loading="lazy">
                                    ${overlayIcon}
                                </div>
                                <div class="card-info">
                                    <h3 class="card-title">${item.title}</h3>
                                    <div class="card-meta-row">
                                        <span class="card-date"><i class="fa-regular fa-calendar"></i> ${item.date || 'हालैको'}</span>
                                        <span class="card-views"><i class="fa-solid fa-eye"></i> ${viewCount} पटक हेरिएको</span>
                                    </div>
                                    <div style="display: flex; justify-content: flex-end;">
                                        <button class="read-more-btn">पुरा पढ्नुहोस्</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    grid.innerHTML = html;
                }, (error) => {
                    console.error("Firebase error: ", error);
                    grid.innerHTML = `<div style="text-align: center; color: #ef4444; grid-column: span 2; padding: 40px; font-weight: bold;">डाटा लोड गर्न सकिएन। इन्टरनेट जडान चेक गर्नुहोस्।</div>`;
                });
            } catch (err) {
                console.error("Error setting up snapshot: ", err);
            }
        }

        window.openDetail = async function(index) {
            let item = currentItems[index];
            if (!item) return;

            // Firebase Firestore मा View Count लाई १ ले बढाउने कोड
            if (item.id) {
                try {
                    const docRef = doc(db, "shivpuran", item.id);
                    await updateDoc(docRef, {
                        viewCount: increment(1)
                    });
                } catch (err) {
                    console.error("Error updating view count: ", err);
                }
            }

            let rawVidInput = item.videoId || item.videoLink || '';
            let cleanVideoId = getCleanYouTubeId(rawVidInput);
            let isVideoItem = (item.type === 'video' || cleanVideoId.length === 11);

            let topAdBanner = `
                <div class="banner-ad-container">
                    <span>[ Top Banner Ad Here ]</span>
                </div>
            `;

            let mediaBlock = '';
            if (isVideoItem && cleanVideoId.length === 11) {
                mediaBlock = `
                    <div class="video-container">
                        <iframe src="https://www.youtube.com/embed/${cleanVideoId}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>
                `;
            } else {
                let detailImg = item.imageUrl || 'https://images.unsplash.com/photo-1609137144813-772c676d75ce?w=800';
                mediaBlock = `
                    <div class="modal-image-container">
                        <img src="${detailImg}" alt="Image">
                    </div>
                `;
            }

            let formattedDescription = insertAdAfterWords(item.description || '', 50);
            let updatedViews = (item.viewCount || 0) + 1;

            let contentHTML = `
                <div class="modal-meta-info">
                    <span class="modal-date"><i class="fa-regular fa-calendar"></i> ${item.date || ''}</span>
                    <span class="modal-views"><i class="fa-solid fa-eye"></i> ${updatedViews} पटक हेरिएको</span>
                </div>
                <div class="modal-header-title">${item.title}</div>
                ${topAdBanner}
                ${mediaBlock}
                ${formattedDescription}
            `;

            document.getElementById('modalContentArea').innerHTML = contentHTML;
            document.getElementById('fullScreenModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        window.closeFullModal = function() {
            document.getElementById('modalContentArea').innerHTML = '';
            document.getElementById('fullScreenModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadShivPuranData();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.log('Service Worker Failed!', err));
            });
        }
    </script>
</body>
</html>
