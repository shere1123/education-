<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>लोकसेवा तथा जागिर सूचना (Vacancy)</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <style>
        * { box-sizing: border-box; }
        :root {
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            --bg-color: #0b0f19;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0 0 90px 0;
            overflow-x: hidden;
        }
        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white; text-align: center;
            padding: 25px 20px; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        header h1 { margin: 0; font-size: 24px; font-weight: 800; }
        header p { margin: 6px 0 0 0; font-size: 13px; opacity: 0.8; }

        .container { width: 100%; max-width: 800px; margin: 20px auto; padding: 0 15px; }

        .vacancy-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media(min-width: 600px) {
            .vacancy-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .vacancy-card {
            background: #1e293b;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .vacancy-card:hover {
            transform: translateY(-4px);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .thumbnail-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #0f172a;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .thumbnail-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .thumbnail-placeholder {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 600;
            text-align: center;
            padding: 10px;
        }

        .vacancy-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .vacancy-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #38bdf8;
            font-weight: 600;
        }
        .vacancy-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            line-height: 1.4;
        }

        /* True Full Screen Reading View */
        #fullScreenModal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0; top: 0;
            width: 100vw; height: 100vh;
            background-color: #0b0f19;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-inner {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            background: transparent;
            padding: 10px 0;
        }
        
        .modal-header-title {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 12px;
            line-height: 1.45;
        }
        .modal-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            color: #38bdf8;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .modal-image-container {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal-image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .modal-description {
            font-size: 19px;
            color: #f1f5f9;
            line-height: 1.8;
            font-weight: 500;
            white-space: pre-line;
            margin-bottom: 25px;
        }

        /* Banner Ad Box inside Full Screen */
        .modal-ad-box {
            width: 100%;
            background: #1e293b;
            border: 1px dashed rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            margin-bottom: 25px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 14px;
        }

        .close-modal-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
            margin-bottom: 40px;
        }

        /* Bottom Navigation Bar Styles */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 450px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 50px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.15) inset;
            z-index: 900;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 30px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 4px;
        }
        .nav-item i { font-size: 16px; transition: transform 0.3s ease; }
        .nav-item.active {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 30px;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }
        .nav-item.active i { color: #ffffff; transform: scale(1.1); }
        .nav-item:hover { color: #f8fafc; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <h1>जागिर तथा भ्याकेन्सी सूचना</h1>
        <p>नयाँ सरकारी तथा गैरसरकारी जागिरका विज्ञापनहरू</p>
    </header>

    <div class="container">
        <div id="vacancyContainer" class="vacancy-grid">
            <div style="text-align: center; color: #94a3b8; grid-column: span 2; padding: 40px; font-weight: bold;">सूचनाहरू लोड हुँदैछन्...</div>
        </div>
    </div>

    <!-- True Full Screen Reading View -->
    <div id="fullScreenModal">
        <div class="modal-inner">
            <div id="modalContentArea"></div>
            
            <!-- विज्ञापन (Banner Ads) राख्ने बक्स -->
            <div class="modal-ad-box">
                <span>[ विज्ञापन ब्यानर बक्स (Banner Ad Space) ]</span>
            </div>

            <button class="close-modal-btn" onclick="closeFullModal()">बन्द गर्नुहोस् (Close)</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="vacancy.html" class="nav-item active">
            <i class="fa-solid fa-file-lines"></i>
            <span>Vacancy</span>
        </a>
        <a href="news.html" class="nav-item">
            <i class="fa-solid fa-bell"></i>
            <span>News</span>
        </a>
        <a href="more.html" class="nav-item">
            <i class="fa-solid fa-bars"></i>
            <span>More</span>
        </a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, increment, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAe32qMUjBMUBL4N6jS8eyVixK2gHMVuXw",
            authDomain: "gk-nepal-df869.firebaseapp.com",
            projectId: "gk-nepal-df869",
            storageBucket: "gk-nepal-df869.firebasestorage.app",
            messagingSenderId: "454233438620",
            appId: "1:454233438620:web:a8292322e04ffcf2b23059"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        try {
            enableIndexedDbPersistence(db).catch((err) => {});
        } catch (e) {}

        const vacancyContainer = document.getElementById('vacancyContainer');
        const fullScreenModal = document.getElementById('fullScreenModal');
        const modalContentArea = document.getElementById('modalContentArea');

        let vacanciesList = [];

        async function fetchVacancies() {
            try {
                const querySnapshot = await getDocs(collection(db, "vacancies"));
                vacanciesList = [];
                querySnapshot.forEach((docSnap) => {
                    vacanciesList.push({ id: docSnap.id, ...docSnap.data() });
                });

                if (vacanciesList.length === 0) {
                    vacancyContainer.innerHTML = `<div style="text-align: center; color: #94a3b8; grid-column: span 2; padding: 40px; font-weight: bold;">हाल कुनै पनि सूचना उपलब्ध छैन।</div>`;
                    return;
                }

                renderVacancies();
            } catch (error) {
                console.error("Error fetching vacancies: ", error);
                vacancyContainer.innerHTML = `<div style="text-align: center; color: #ef4444; grid-column: span 2; padding: 40px; font-weight: bold;">सूचनाहरू लोड गर्न सकिएन। इन्टरनेट जडान चेक गर्नुहोस्।</div>`;
            }
        }

        function renderVacancies() {
            let html = '';
            vacanciesList.forEach((item, index) => {
                let imgTag = item.imageUrl ? `<img src="${item.imageUrl}" alt="Vacancy Banner" loading="lazy">` : `<div class="thumbnail-placeholder">सूचना ब्यानर</div>`;
                let viewsCount = item.views || 0;
                
                html += `
                    <div class="vacancy-card" onclick="openVacancyDetail(${index})">
                        <div class="thumbnail-box">
                            ${imgTag}
                        </div>
                        <div class="vacancy-info">
                            <div class="vacancy-meta">
                                <span><i class="fa-regular fa-calendar"></i> ${item.date || 'हालैको'}</span>
                                <span><i class="fa-regular fa-eye"></i> ${viewsCount} views</span>
                            </div>
                            <h3 class="vacancy-title">${item.title}</h3>
                        </div>
                    </div>
                `;
            });
            vacancyContainer.innerHTML = html;
        }

        window.openVacancyDetail = async function(index) {
            let item = vacanciesList[index];
            if (!item) return;

            // Increment views in Firestore
            try {
                const vacancyRef = doc(db, "vacancies", item.id);
                await updateDoc(vacancyRef, {
                    views: increment(1)
                });
                item.views = (item.views || 0) + 1;
            } catch (err) {
                console.error("Error updating views: ", err);
            }

            let modalImgTag = item.imageUrl ? `<div class="modal-image-container"><img src="${item.imageUrl}" alt="Detail Banner"></div>` : '';

            modalContentArea.innerHTML = `
                <div class="modal-meta">
                    <span><i class="fa-regular fa-calendar"></i> ${item.date || ''}</span>
                    <span><i class="fa-regular fa-eye"></i> ${item.views || 0} views</span>
                </div>
                <div class="modal-header-title">${item.title}</div>
                ${modalImgTag}
                <div class="modal-description">${item.description || 'विस्तृत विवरण उपलब्ध छैन।'}</div>
            `;

            fullScreenModal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        window.closeFullModal = function() {
            fullScreenModal.style.display = 'none';
            document.body.style.overflow = 'auto';
            renderVacancies(); // Re-render to update view counts on cards
        }

        fetchVacancies();
    </script>
</body>
</html>
